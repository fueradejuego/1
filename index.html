<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reproductor</title>

  <!-- Estilos de la librería VP -->
  <link rel="stylesheet" href="css/player.css">

  <!-- Página en blanco: el reproductor ocupa toda la ventana -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* El contenedor llena la pantalla (anula el 16:9 y el borde redondeado de la librería) */
    #player.vp-player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <!-- Contenedor del reproductor -->
  <div id="player"></div>

  <!-- Núcleo -->
  <script src="js/core/loader.js"></script>
  <script src="js/core/base.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/api.js"></script>

  <!-- Motores -->
  <script src="js/players/native.js"></script>
  <script src="js/players/iframe.js"></script>
  <script src="js/players/oplayer.js"></script>
  <script src="js/players/shaka.js"></script>
  <script src="js/players/clappr.js"></script>
  <script src="js/players/placeholder.js"></script>

  <!-- Configuración y arranque -->
  <script>
  (function () {
    'use strict';

    /* ============================================================
     *  CONFIGURACIÓN
     * ============================================================ */

    // Endpoint del backend. Relativa porque el reproductor vive en el
    // mismo dominio que la API (zicotv.cc) y así se evita CORS.
    // Si sirves esta página desde otro dominio, usa la URL absoluta:
    //   VP.api.base = 'https://zicotv.cc/api/player/';
    VP.api.base = '/api/player/4';

    // Cómo resolver un canal:
    //   'iframe' (por defecto): incrusta la página /api/player/<canal>.
    //   'parse'               : lee las ZT_* y pide las URLs firmadas a /renew.
    VP.config.apiMode = 'iframe';

    // Tiempo máximo de espera de la API (solo se usa en modo 'parse').
    VP.config.apiTimeout = 15000;

    // Nombre del motor del backend -> motor de VP.
    VP.config.engineAliases = { clappr: 'clappr', videojs: 'oplayer' };

    /* ============================================================
     *  CANAL  (?canal=4  -> por defecto 4)
     * ============================================================ */

    var params  = new URLSearchParams(location.search);
    var canal   = params.get('canal') || '4';

    // Permite forzar el modo por URL: ?canal=4&mode=parse
    var mode    = params.get('mode') || VP.config.apiMode;

    /* ============================================================
     *  ARRANQUE
     * ============================================================ */

    var mount = document.getElementById('player');

    VP.api.load(canal, { mode: mode })
      .then(function (config) {
        VP.create('#player', config);
      })
      .catch(function (err) {
        var msg = (err && err.message) || 'No se pudo cargar el canal.';
        mount.classList.add('vp-player');
        mount.setAttribute('data-vp-status', 'error');
        mount.innerHTML =
          '<div class="vp-overlay"><div class="vp-error"></div></div>';
        mount.querySelector('.vp-error').textContent = msg;
        console.error('[VP]', err);
      });
  })();
  </script>
</body>
</html>
