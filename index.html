<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reproductor · todo en uno</title>

  <!-- =====================================================================
       ESTILOS  (css/player.css + estilos de la página)
       ===================================================================== -->
  <style>
    /* ---------- Estilos base de la librería VP ---------- */
    .vp-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 12px;
      isolation: isolate;
    }

    /* Cualquier nodo raíz que inyecte un motor ocupa todo el contenedor. */
    .vp-player > video,
    .vp-player > .vp-video,
    .vp-player > iframe.vp-iframe,
    .vp-player > .vp-clappr,
    .vp-player > .vp-placeholder,
    .vp-player > div {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
    }

    .vp-player iframe.vp-iframe {
      position: absolute;
      inset: 0;
    }

    /* ---------- overlay de estado (cargando / error) ---------- */
    .vp-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      text-align: center;
      color: #fff;
      font: 500 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .vp-player[data-vp-status="error"] .vp-overlay {
      pointer-events: auto;
      background: rgba(12, 2, 3, 0.85);
    }

    .vp-spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      animation: vp-spin 0.8s linear infinite;
    }

    @keyframes vp-spin {
      to { transform: rotate(360deg); }
    }

    .vp-status-text {
      opacity: 0.85;
    }

    .vp-error {
      max-width: 420px;
      padding: 14px 18px;
      border-radius: 10px;
      background: #3a1113;
      border: 1px solid #7a2226;
      color: #ffd9db;
      font-weight: 500;
    }

    /* ---------- placeholder (click to play) ---------- */
    .vp-placeholder {
      position: absolute;
      inset: 0;
      display: block;
      padding: 0;
      border: 0;
      margin: 0;
      cursor: pointer;
      background: #000;
      color: inherit;
    }

    .vp-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
      transition: opacity 0.2s ease;
    }

    .vp-placeholder:hover img {
      opacity: 0.95;
    }

    .vp-placeholder .vp-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78px;
      height: 78px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(2px);
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .vp-placeholder .vp-play::after {
      content: "";
      display: block;
      margin-left: 6px;
      border-style: solid;
      border-width: 16px 0 16px 26px;
      border-color: transparent transparent transparent #fff;
    }

    .vp-placeholder:hover .vp-play,
    .vp-placeholder:focus-visible .vp-play {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(229, 9, 20, 0.92);
    }

    .vp-placeholder:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -4px;
    }

    .vp-placeholder .vp-ph-title {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 26px 16px 14px;
      text-align: left;
      color: #fff;
      font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
    }

    /* ---------- Página: pantalla completa + barra superior ---------- */
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* El reproductor llena la pantalla (anula 16:9 y border-radius) */
    #player.vp-player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }

    /* Barra superior (FUERA de #player: VP.create() vacía el contenedor) */
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0));
      pointer-events: none;
    }

    #ui .title { font-weight: 700; }

    #ui .group { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }

    #ui button.pill {
      padding: 5px 11px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #ui button.pill:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    #ui button.pill[aria-pressed="true"] { background: #e50914; border-color: #e50914; }
    #ui button.pill:disabled { opacity: 0.4; cursor: not-allowed; }

    #ui .status { margin-left: auto; opacity: 0.75; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Contenedor del reproductor -->
  <div id="player"></div>

  <!-- Barra: modo (iframe/parse), selector de CDN y estado -->
  <div id="ui">
    <span class="title" id="ui-title">Reproductor</span>

    <span class="group" id="ui-modes">
      <button type="button" class="pill" id="mode-iframe">iframe</button>
      <button type="button" class="pill" id="mode-parse">parse</button>
    </span>

    <span class="group" id="ui-cdns"></span>

    <span class="status" id="ui-status"></span>
  </div>

  <!-- =====================================================================
       LIBRERÍA VP  (js/core/*  +  js/players/*)
       ===================================================================== -->
  <script>
  /* ------------------------------------------------------------------ *
   *  loader.js — carga (una sola vez) las librerías externas desde CDN
   * ------------------------------------------------------------------ */
  (function (global) {
    'use strict';
    var VP = (global.VP = global.VP || {});

    VP.libs = {
      shaka: {
        globals: ['shaka'],
        scripts: [
          'https://cdn.jsdelivr.net/npm/shaka-player@5.3.5/dist/shaka-player.compiled.js',
          'https://ajax.googleapis.com/ajax/libs/shaka-player/4.16.4/shaka-player.compiled.js',
          'https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.3.5/shaka-player.compiled.js'
        ]
      },
      clappr: {
        globals: ['Clappr'],
        scripts: [
          'https://cdn.jsdelivr.net/npm/@clappr/player@0.14.10/dist/clappr.min.js',
          'https://cdn.jsdelivr.net/npm/clappr@0.10.0/dist/clappr.min.js'
        ]
      },
      openplayer: {
        globals: ['OpenPlayerJS', 'OpenPlayer'],
        styles: [
          'https://cdn.jsdelivr.net/npm/@openplayerjs/player@3.6.5/dist/openplayer.css'
        ],
        scripts: [
          'https://cdn.jsdelivr.net/npm/@openplayerjs/player@3.6.5/dist/openplayer.js',
          'https://cdn.jsdelivr.net/npm/openplayerjs@2.14.12/dist/openplayer.min.js'
        ]
      },
      openplayerHls: {
        globals: null,
        scripts: [
          'https://cdn.jsdelivr.net/npm/@openplayerjs/hls@3.6.4/dist/openplayer-hls.js',
          'https://cdn.jsdelivr.net/npm/openplayerjs-hls@latest/dist/openplayer-hls.min.js'
        ]
      }
    };

    var _libPromises = {};
    var _styles = {};

    function hasGlobal(names) {
      if (!names || !names.length) return false;
      for (var i = 0; i < names.length; i++) {
        if (global[names[i]]) return true;
      }
      return false;
    }

    function injectStyle(href) {
      if (_styles[href]) return _styles[href];
      _styles[href] = new Promise(function (resolve) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.onload = function () { resolve(true); };
        link.onerror = function () { resolve(false); };
        document.head.appendChild(link);
      });
      return _styles[href];
    }

    function injectScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = function () { resolve(src); };
        s.onerror = function () { reject(new Error('No se pudo cargar el script: ' + src)); };
        document.head.appendChild(s);
      });
    }

    VP.loadLib = function (name) {
      var def = VP.libs[name];
      if (!def) return Promise.reject(new Error('Librería desconocida: ' + name));
      if (def.globals && hasGlobal(def.globals)) return Promise.resolve(true);
      if (_libPromises[name]) return _libPromises[name];

      var task = Promise.all((def.styles || []).map(injectStyle)).then(function () {
        var urls = def.scripts || [];
        var lastError = null;

        function attempt(i) {
          if (i >= urls.length) {
            return Promise.reject(lastError || new Error('No hay fuentes disponibles para ' + name));
          }
          return injectScript(urls[i]).then(function () {
            if (!def.globals || hasGlobal(def.globals)) return true;
            lastError = new Error('El script cargó pero no expone: ' + def.globals.join(' / '));
            return attempt(i + 1);
          }, function (err) {
            lastError = err;
            return attempt(i + 1);
          });
        }
        return attempt(0);
      });

      _libPromises[name] = task['catch'](function (err) {
        delete _libPromises[name];
        throw err;
      });
      return _libPromises[name];
    };
  })(window);

  /* ------------------------------------------------------------------ *
   *  base.js — utilidades comunes y clase base de todos los motores
   * ------------------------------------------------------------------ */
  (function (global) {
    'use strict';
    var VP = (global.VP = global.VP || {});

    VP.uid = function (prefix) {
      return (prefix || 'vp') + '-' + Math.random().toString(36).slice(2, 9);
    };

    VP.isHls = function (url) { return /\.m3u8(\?|#|$)/i.test(String(url || '')); };
    VP.isDash = function (url) { return /\.mpd(\?|#|$)/i.test(String(url || '')); };

    VP.guessMime = function (url) {
      url = String(url || '');
      if (VP.isHls(url)) return 'application/x-mpegURL';
      if (VP.isDash(url)) return 'application/dash+xml';
      if (/\.webm(\?|#|$)/i.test(url)) return 'video/webm';
      if (/\.(ogv|ogg)(\?|#|$)/i.test(url)) return 'video/ogg';
      if (/\.(mp4|m4v|mov)(\?|#|$)/i.test(url)) return 'video/mp4';
      return 'video/mp4';
    };

    VP.toEmbedUrl = function (url) {
      if (!url) return url;
      var u = String(url).trim();
      var m;

      m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([\w-]{11})/i);
      if (m) {
        var start = u.match(/[?&](?:t|start)=(\d+)/i);
        return 'https://www.youtube.com/embed/' + m[1] + '?rel=0' + (start ? '&start=' + start[1] : '');
      }
      m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
      if (m) return 'https://player.vimeo.com/video/' + m[1];
      m = u.match(/dailymotion\.com\/video\/([a-z0-9]+)/i);
      if (m) return 'https://www.dailymotion.com/embed/video/' + m[1];
      m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i);
      if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
      m = u.match(/streamable\.com\/([a-z0-9]+)/i);
      if (m) return 'https://streamable.com/e/' + m[1];

      return u;
    };

    VP.isEmbeddable = function (url) {
      return VP.toEmbedUrl(url) !== String(url || '').trim();
    };

    VP.BasePlayer = function (container, config) {
      this.container = container;
      this.config = config || {};
      this.el = null;
      this.player = null;
      this.engineName = null;
      this._destroyed = false;
    };

    VP.BasePlayer.prototype = {
      constructor: VP.BasePlayer,

      mount: function () {
        return Promise.reject(new Error('mount() no implementado'));
      },

      destroy: function () {
        if (this._destroyed) return;
        this._destroyed = true;
        if (typeof this.onDestroy === 'function') {
          try { this.onDestroy(); } catch (e) { /* noop */ }
        }
        if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
        this.el = null;
        this.player = null;
        this.clearStatus();
      },

      emit: function (name, detail) {
        this.container.dispatchEvent(new CustomEvent('vp:' + name, {
          detail: detail || {},
          bubbles: true
        }));
      },

      status: function (text, kind) {
        this.container.setAttribute('data-vp-status', kind || 'loading');
        var overlay = this.container.querySelector(':scope > .vp-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'vp-overlay';
          this.container.appendChild(overlay);
        }
        overlay.innerHTML = '';
        if (kind === 'error') {
          var box = document.createElement('div');
          box.className = 'vp-error';
          box.textContent = text || 'No se pudo cargar el reproductor.';
          overlay.appendChild(box);
        } else {
          var spin = document.createElement('div');
          spin.className = 'vp-spinner';
          overlay.appendChild(spin);
          if (text) {
            var t = document.createElement('div');
            t.className = 'vp-status-text';
            t.textContent = text;
            overlay.appendChild(t);
          }
        }
      },

      clearStatus: function () {
        this.container.removeAttribute('data-vp-status');
        var overlay = this.container.querySelector(':scope > .vp-overlay');
        if (overlay) overlay.remove();
      },

      fail: function (err) {
        var msg = typeof err === 'string'
          ? err
          : (err && (err.message || err.code)) || 'Error desconocido';
        this.status(msg, 'error');
        this.emit('error', { error: err, message: msg, engine: this.engineName });
      }
    };
  })(window);

  /* ------------------------------------------------------------------ *
   *  registry.js — registro de motores y fábrica VP.create()
   * ------------------------------------------------------------------ */
  (function (global) {
    'use strict';
    var VP = (global.VP = global.VP || {});

    VP.config = VP.config || {};
    VP.config.defaultType = VP.config.defaultType || 'native';
    VP.config.apiTimeout = (VP.config.apiTimeout === undefined) ? 15000 : VP.config.apiTimeout;
    VP.config.apiMode = VP.config.apiMode || 'iframe';
    VP.config.typeAliases = VP.config.typeAliases || {};
    VP.config.engineAliases = VP.config.engineAliases || {
      'clappr': 'clappr',
      'videojs': 'oplayer'
    };

    VP._engines = {};

    VP.register = function (name, Ctor, meta) {
      VP._engines[name] = { Ctor: Ctor, meta: meta || {} };
    };

    VP.hasEngine = function (name) { return !!VP._engines[name]; };

    VP.engines = function () {
      var list = [];
      for (var k in VP._engines) if (VP._engines.hasOwnProperty(k)) list.push(k);
      return list;
    };

    VP.engineInfo = function (name) {
      var e = VP._engines[name];
      return e ? { name: name, label: e.meta.label || name, meta: e.meta } : null;
    };

    VP.normalizeType = function (type) {
      if (type === undefined || type === null || type === '') return VP.config.defaultType;
      var s = String(type).trim().toLowerCase();
      if (/^\d+$/.test(s)) {
        return VP.config.typeAliases[s] || s;
      }
      return s;
    };

    VP.create = function (container, config) {
      if (typeof container === 'string') container = document.querySelector(container);
      if (!container) throw new Error('VP.create: contenedor no encontrado');

      var cfg = Object.assign({}, config || {});
      var engine = VP.normalizeType(cfg.type);
      var entry = VP._engines[engine];
      if (!entry) {
        throw new Error('VP.create: motor no soportado ("' + cfg.type + '"). Disponibles: ' + VP.engines().join(', '));
      }

      VP.destroy(container);
      container.innerHTML = '';
      container.classList.add('vp-player');
      container.setAttribute('data-vp-engine', engine);

      var instance = new entry.Ctor(container, cfg);
      instance.engineName = engine;
      container.__vp = instance;

      instance.emit('mount', { engine: engine });

      Promise.resolve()
        .then(function () { return instance.mount(); })
        .then(function () {
          if (!instance._destroyed) instance.emit('ready', { engine: engine });
        })
        ['catch'](function (err) { instance.fail(err); });

      return instance;
    };

    VP.destroy = function (container) {
      if (typeof container === 'string') container = document.querySelector(container);
      if (container && container.__vp) {
        try { container.__vp.destroy(); } catch (e) { /* noop */ }
        container.__vp = null;
      }
    };
  })(window);

  /* ------------------------------------------------------------------ *
   *  api.js — obtiene la configuración de un canal desde el backend
   * ------------------------------------------------------------------ */
  (function (global) {
    'use strict';
    var VP = (global.VP = global.VP || {});

    function first() {
      for (var i = 0; i < arguments.length; i++) {
        var v = arguments[i];
        if (v !== undefined && v !== null && v !== '') return v;
      }
      return undefined;
    }

    function scanValue(s, i) {
      var c = s.charAt(i);
      if (c === '"' || c === "'") {
        var q = c, j = i + 1;
        while (j < s.length) {
          var d = s.charAt(j);
          if (d === '\\') { j += 2; continue; }
          if (d === q) return j + 1;
          j++;
        }
        return -1;
      }
      if (c === '{' || c === '[') {
        var depth = 0, k = i;
        while (k < s.length) {
          var e = s.charAt(k);
          if (e === '"' || e === "'") { var n = scanValue(s, k); if (n < 0) return -1; k = n; continue; }
          if (e === '{' || e === '[') depth++;
          else if (e === '}' || e === ']') { depth--; if (depth === 0) return k + 1; }
          k++;
        }
        return -1;
      }
      var end = i;
      while (end < s.length && s.charAt(end) !== ';' && s.charAt(end) !== '\n' && s.charAt(end) !== '\r') end++;
      return end;
    }

    function readVar(html, name) {
      var re = new RegExp('\\b' + name + '\\s*=\\s*', 'g');
      var m;
      while ((m = re.exec(html)) !== null) {
        var i = m.index + m[0].length;
        var c = html.charAt(i);
        var ok = c === '{' || c === '[' || c === '"' || c === "'" ||
                 c === 'n' || c === 't' || c === 'f' || c === '-' || (c >= '0' && c <= '9');
        if (!ok) continue;
        var end = scanValue(html, i);
        if (end < 0) continue;
        try { return JSON.parse(html.slice(i, end)); } catch (e) { /* siguiente coincidencia */ }
      }
      return undefined;
    }

    var ZT_VARS = [
      'ZT_ENGINE', 'ZT_UMAMI', 'ZT_SOURCES', 'ZT_STREAM_URL', 'ZT_SRC_GATE',
      'ZT_RENEW', 'ZT_CDN_VIEWERS_URL', 'ZT_VIEWERS_WS', 'ZT_P2P', 'ZT_BEAT',
      'ZT_CONN_TOKEN', 'ZT_CONN_HB_URL', 'ZT_CONN_LIMIT', 'ZT_CONN_MAX',
      'ZT_PREMIUM_GATE', 'ZT_APP_GATE', 'ZT_TS_LOG_URL', 'ZT_BLOCK_ADBLOCK'
    ];

    VP.api = {
      base: '/api/player/',

      url: function (channel) {
        var s = String(channel == null ? '' : channel).trim();
        if (/^https?:\/\//i.test(s)) return s;
        return VP.api.base + s.replace(/^\/+/, '');
      },

      load: function (channel, options) {
        options = options || {};
        var mode = options.mode || VP.config.apiMode || 'iframe';
        if (mode === 'iframe') return VP.api.iframe(channel, options);
        return VP.api.fetchConfig(channel, options);
      },

      iframe: function (channel, options) {
        options = options || {};
        var url = VP.api.url(channel);
        return Promise.resolve(VP.api._finish({
          type: 'iframe',
          src: url,
          title: options.title || null,
          channel: channel,
          lazy: options.lazy,
          options: options.iframeOptions
        }, { channel: channel, endpoint: url, mode: 'iframe' }, url));
      },

      fetchConfig: function (channel, options) {
        var url = VP.api.url(channel);
        options = options || {};
        var timeout = (options.timeout !== undefined) ? options.timeout : (VP.config.apiTimeout || 0);

        var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timer = null;
        if (controller && timeout > 0) {
          timer = setTimeout(function () { controller.abort(); }, timeout);
        }
        function clear() { if (timer) { clearTimeout(timer); timer = null; } }

        var headers = Object.assign({ 'Accept': 'application/json, text/html, */*' }, options.headers);
        var init = { headers: headers, credentials: options.credentials || 'same-origin' };
        if (controller) init.signal = controller.signal;

        return fetch(url, init).then(function (res) {
          clear();
          if (!res.ok) throw new Error('API ' + res.status + ' al pedir ' + url);
          var ct = (res.headers.get('content-type') || '').toLowerCase();
          if (ct.indexOf('json') !== -1) {
            return res.json().then(function (j) { return VP.api.normalize(j, url); });
          }
          return res.text().then(function (txt) {
            var t = txt.replace(/^\uFEFF/, '').trim();
            if (t.charAt(0) === '{' || t.charAt(0) === '[') {
              try { return VP.api.normalize(JSON.parse(t), url); } catch (e) { /* no era JSON */ }
            }
            return VP.api.fromHtml(txt, url, options);
          });
        }, function (err) {
          clear();
          if (err && err.name === 'AbortError') {
            throw new Error('Tiempo de espera agotado (' + timeout + ' ms) al consultar ' + url);
          }
          throw new Error('No se pudo conectar con ' + url + ' (' + ((err && err.message) || 'error de red') + ')');
        });
      },

      parseZt: function (html) {
        html = String(html || '');
        var out = { raw: html };
        for (var i = 0; i < ZT_VARS.length; i++) {
          var name = ZT_VARS[i];
          var v = readVar(html, name);
          if (v !== undefined) out[name] = v;
        }
        out.engine  = out.ZT_ENGINE || null;
        out.title   = (out.ZT_UMAMI && out.ZT_UMAMI.canal) || null;

    function play(config, index) {
      var s = config.sources[index];
      if (!s || !s.url) return;

      selectedLabel = s.label || null;

      VP.create('#player', {
        type: config.type,          // motor decidido por ZT_ENGINE
        src: s.url,                 // URL firmada devuelta por /renew
        title: config.title,
        autoplay: wantAutoplay,
        muted: wantMuted,
        sourceLabel: s.label
      });

      renderCdns(config, index);
      setStatus(s.label || '');
    }

    function renderCdns(config, activeIndex) {
      uiCdns.innerHTML = '';
      (config.sources || []).forEach(function (s, i) {
        if (!s || s.hidden) return;

        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill';
        b.textContent = s.label || ('Servidor ' + (i + 1));
        b.setAttribute('aria-pressed', String(i === activeIndex));

        if (!s.url || s.locked || s.off) {
          b.disabled = true;
          if (s.locked) b.textContent += ' 🔒';
        } else {
          b.addEventListener('click', function () { play(config, i); });
        }
        uiCdns.appendChild(b);
      });
    }

    /* Renueva las URLs firmadas antes de que caduque el token (ttl). */
    function scheduleRenew(config) {
      clearRenew();
      var ttl = config.renew && config.renew.ttl;
      if (!ttl || ttl < 30) return;

      var wait = Math.max(20, ttl - 60) * 1000;   // 60 s de margen
      renewTimer = setTimeout(load, wait);
      setStatus((selectedLabel || '') + ' · renueva en ' + Math.round(wait / 1000) + ' s');
    }

    /* ============================================================
     *  ARRANQUE
     * ============================================================ */
    function load() {
      clearRenew();
      updateModeButtons();
      uiTitle.textContent = 'Canal ' + canal;
      setStatus('cargando…');

      /* ---- modo iframe: incrusta la propia página del canal ---- */
      if (mode === 'iframe') {
        uiCdns.innerHTML = '';
        VP.api.load(canal, { mode: 'iframe' }).then(function (config) {
          VP.create('#player', config);
          setStatus('iframe');
        })['catch'](function (err) {
          fail((err && err.message) || 'No se pudo cargar el canal.');
        });
        return;
      }

      /* ---- modo parse: lee las ZT_* y pide las URLs a /renew ---- */
      VP.api.load(canal, { mode: 'parse' }).then(function (config) {
        if (!config.sources || !config.sources.length) {
          throw new Error('El canal no devolvió servidores.');
        }

        // Conserva el servidor elegido entre renovaciones (por etiqueta).
        var idx = config.sourceIndex;
        if (selectedLabel) {
          config.sources.forEach(function (s, i) {
            if (s && s.label === selectedLabel && s.url) idx = i;
          });
        }
        if (idx == null || idx < 0 || !config.sources[idx] || !config.sources[idx].url) {
          var ok = usableIndexes(config.sources);
          idx = ok.length ? ok[0] : -1;
        }
        if (idx < 0) {
          throw new Error('Ningún servidor tiene URL utilizable ' +
            '(posible puerta Turnstile o canal sin fuentes).');
        }

        play(config, idx);
        scheduleRenew(config);
      })['catch'](function (err) {
        fail((err && err.message) || 'No se pudo cargar el canal.');
      });
    }

    /* Conmutador de modo */
    btnIframe.addEventListener('click', function () {
      if (mode === 'iframe') return;
      mode = 'iframe'; selectedLabel = null; load();
    });
    btnParse.addEventListener('click', function () {
      if (mode === 'parse') return;
      mode = 'parse'; load();
    });

    load();
  })();
  </script>
</body>
</html>
